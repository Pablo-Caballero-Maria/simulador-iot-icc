name: "Informe de error"
description: "Algo no funciona como debería."
title: "[Error] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ¡Gracias por tomarte el tiempo de informar! Si es un problema de **seguridad**, no uses este formulario: sigue [SECURITY.md](../blob/main/SECURITY.md).
  - type: dropdown
    id: where
    attributes:
      label: "Dónde"
      options:
        - "La escena 3D"
        - "Un panel (Explicación, Parámetros, Provocar, Datos, Mensajes, Consola, Guía)"
        - "Un escenario"
        - "Las páginas Cómo funciona o Economía"
        - "El motor de simulación (src/sim)"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: "Qué ha pasado"
      description: "Una descripción clara del problema, con capturas si ayudan."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Pasos para reproducirlo"
      placeholder: |
        1. Ve a …
        2. Pulsa …
        3. Fíjate en …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Qué esperabas"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: "Navegador y dispositivo"
      placeholder: "p. ej. Chrome 142 en Windows, Safari en iPad…"
  - type: textarea
    id: logs
    attributes:
      label: "Registros o salida de la consola"
      description: "Quita contraseñas, tokens o claves antes de pegarlo."
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: "Antes de enviarlo"
      options:
        - label: "He buscado en los issues abiertos y cerrados y no está ya."
          required: true
        - label: "Acepto seguir el [código de conducta](../blob/main/CODE_OF_CONDUCT.md)."
          required: true
